name: Example scan (dogfood)

# Dogfoods the action by scanning this repository's own flake, rendering the
# markdown report layout, and uploading the report artifact.

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:17 UTC. Off the hour to avoid the scheduler stampede and to
    # stagger fan-out against other scheduled scans (doc §9).
    - cron: "17 3 * * *"

permissions:
  contents: read # checkout

jobs:
  scan:
    if: github.event_name != 'schedule' || github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the action from this same checkout (local reference), so the dogfood
      # always exercises the current revision.
      - id: flakevuln
        uses: ./
        with:
          # flakeref omitted -> scans the checked-out workspace (.)
          targets: |
            packages.x86_64-linux.flakevuln
          unstable-ref: github:NixOS/nixpkgs/nixos-unstable
          whitelist: .github/flakevuln/manual_analysis.csv
          nixprs: true
          nixprs-exclude-packages: linux
          nixtracker: true

      - name: Check flakevuln outputs
        run: |
          test -s "${{ steps.flakevuln.outputs.findings-path }}"
          test -s "${{ steps.flakevuln.outputs.report-path }}/README.md"
